[build-system]
requires = [
    "scikit-build-core>=1.1.0",
    "nanobind>=3.1.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "muxtools-styx"
version = "0.3.0"
description = "Local policy layer and native Anitomy binding for muxtools"
authors = [{ name = "Vodes", email = "vodes.imp@gmail.com" }]
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=5.0.0",
    "muxtools>=0.4.3",
]
classifiers = [
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Multimedia :: Video",
]

[project.urls]
"Source Code" = "https://github.com/Vodes/muxtools-styx"

[project.scripts]
muxtools-styx = "muxtools_styx:main"
mt-styx = "muxtools_styx:main"
mts = "muxtools_styx:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyrefly>=1.3.1",
    "ruff>=0.16.9",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/muxtools_styx"]
wheel.py-api = "cp312"
sdist.inclusion-mode = "explicit"
sdist.include = [
    "CMakeLists.txt",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src",
    "tests",
    "subprojects/anitomy",
]
sdist.exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "subprojects/anitomy/.git",
]

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.pyrefly]
preset = "default"
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.12"

[tool.cibuildwheel]
build = ["cp312-*"]
skip = ["*-musllinux_*"]
audit-requires = ["abi3audit"]
audit-command = "abi3audit --strict --report {abi3_wheel}"
test-command = "python -c \"from muxtools_styx import _anitomy; assert _anitomy.parse('[Group] Show - 01 [1080p CR].mkv')\""
