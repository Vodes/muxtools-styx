[project]
name = "muxtools-styx"
version = "0.3.0"
description = "Commandline Tool for the Styx backend/downloader using muxtools"
authors = [{ name = "Vodes", email = "vodes.imp@gmail.com" }]
dependencies = [
    "muxtools",
    "click>=8.1,<9.0",
    "anitopy>=2.1.1",
]
classifiers = [
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MPL 2.0" }

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project.urls]
"Source Code" = "https://github.com/Vodes/muxtools-styx"

[project.scripts]
muxtools-styx = "muxtools_styx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/muxtools_styx"]

[tool.uv.sources]
muxtools = { git = "https://github.com/Jaded-Encoding-Thaumaturgy/muxtools" }
